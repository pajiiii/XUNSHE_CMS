<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XUNSHE 产品中心 — 全系列电竞键盘与鼠标">
  <title data-i18n="products.title">产品中心 — XUNSHE 迅蛇</title>
  <link rel="icon" type="image/png" href="/logo/RED_LOGO.png">
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* ── 页面头部 ── */
    .page-header {
      padding: 100px 24px 48px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,0,21,0.08) 0%, transparent 60%);
    }

    .page-header h1 {
      font-family: var(--font-en);
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .page-header h1 .red { color: var(--red-primary); }

    /* ── 筛选栏 ── */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 24px 48px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-card);
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .filter-btn:hover {
      border-color: var(--red-primary);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--red-primary);
      color: #fff;
      border-color: var(--red-primary);
      box-shadow: 0 4px 16px var(--red-glow);
    }

    /* ── 产品网格 ── */
    .products-section {
      padding: 0 24px 80px;
    }

    .products-grid {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: all var(--transition-smooth);
      cursor: pointer;
      position: relative;
      display: block;
    }

    .product-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      box-shadow: 0 0 30px var(--red-glow), inset 0 0 30px var(--red-dim);
      transition: opacity var(--transition-smooth);
      pointer-events: none;
      z-index: 1;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,0,21,0.4);
    }

    .product-card:hover::before { opacity: 1; }

    .product-card .card-img {
      aspect-ratio: 1 / 1;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .product-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .card-img img { transform: scale(1.06); }

    .product-card .card-placeholder {
      font-size: 4rem;
      opacity: 0.12;
    }

    .product-card .card-info {
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .product-card .card-category {
      display: inline-block;
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--red-primary);
      background: rgba(255,0,21,0.1);
      border-radius: 3px;
      margin-bottom: 10px;
    }

    .product-card .card-name {
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .product-card .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .product-card .card-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .product-card .card-features span {
      padding: 3px 8px;
      font-size: 0.72rem;
      border-radius: 3px;
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
    }

    /* ── 加载更多 ── */
    .load-more-wrap {
      text-align: center;
      padding: 40px 0 20px;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--red-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 空状态 ── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 1.1rem;
    }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      .page-header h1 { font-size: 2rem; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- ═══ 顶部导航 ═══ -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
          <img src="/logo/xunshe_top.png" class="brand-icon" style="width:168px;height:42px;border-radius:6px;" alt="XUNSHE">
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home"><img src="/ICON/主页.svg" class="icon-svg icon-svg-sm" alt=""> 首页</a></li>
        <li><a href="products.html" data-i18n="nav.products"><img src="/ICON/产品中心.svg" class="icon-svg icon-svg-sm" alt=""> 产品中心</a></li>
        <li><a href="drivers.html" data-i18n="nav.drivers"><img src="/ICON/驱动支持.svg" class="icon-svg icon-svg-sm" alt=""> 驱动下载</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="lang-switch">
          <button data-lang="zh-CN" class="active">简</button>
          <button data-lang="zh-TC">繁</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="nav-toggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ═══ 页面头部 ═══ -->
  <div class="page-container">
    <section class="page-header" data-animate>
      <h1><span class="red">XUNSHE</span> <span data-i18n="products.title">产品中心</span></h1>
      <p class="section-subtitle" data-i18n="products.subtitle">探索 XUNSHE 全系列电竞装备</p>
    </section>

    <!-- ═══ 筛选栏 ═══ -->
    <div class="filter-bar" data-animate>
      <button class="filter-btn active" data-filter="keyboard" data-i18n="products.filter.keyboard"><img src="/ICON/键盘.svg" class="icon-svg icon-svg-sm" alt=""> 键盘</button>
      <button class="filter-btn" data-filter="mouse" data-i18n="products.filter.mouse"><img src="/ICON/鼠标.svg" class="icon-svg icon-svg-sm" alt=""> 鼠标</button>
      <button class="filter-btn" data-filter="headphone" data-i18n="products.filter.headphone"><img src="/ICON/耳机.svg" class="icon-svg icon-svg-sm" alt=""> 耳机</button>
    </div>

    <!-- ═══ 产品网格 ═══ -->
    <section class="products-section">
      <div class="products-grid" id="productsGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;">
          <div class="loading-spinner"></div>
        </div>
      </div>
      <div class="load-more-wrap hidden" id="loadMoreWrap">
        <button class="btn btn-outline" id="loadMoreBtn" data-i18n="common.loadMore">加载更多</button>
      </div>
    </section>
  </div>

  <!-- ═══ 页脚 ═══ -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand"><span class="brand-red">XUNSHE</span> 迅蛇</div>
        <p class="footer-desc">专业电竞外设品牌。以蛇之迅捷，铸胜利之器。</p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.products">产品</h4>
        <a href="products.html?category=keyboard">电竞键盘</a>
        <a href="products.html?category=mouse">电竞鼠标</a>
        <a href="products.html?category=headphone">电竞耳机</a>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.support">支持</h4>
        <a href="drivers.html">驱动下载</a>
        <a href="manual.html">使用手册</a>
        <a href="terms.html">使用协议</a>
      </div>
    </div>
    <div class="footer-inner footer-bottom">
      <span data-i18n="footer.rights">© 2026 XUNSHE. All rights reserved. 河南郑州讯蛇科技有限公司</span>
      <span data-i18n="footer.icp">豫ICP备2026038032号</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    // ── 产品列表页逻辑 ──
    let currentCategory = 'keyboard';
    let currentPage = 1;
    let productMap = {}; // 全局产品目录缓存
    let allImages = [];  // 全部产品白底图（一次取全量，客户端分页）
    const PAGE_SIZE = 12;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('category');
      if (catParam === 'keyboard' || catParam === 'mouse' || catParam === 'headphone') {
        currentCategory = catParam;
        updateFilterButtons();
      }

      try {
        // 产品量小：一次取全量产品目录 + 全部白底图，分类筛选与分页都在客户端完成，
        // 避免「服务端分页 + 客户端分类过滤」错配导致某些分类永远加载不出。
        const prodRes = await API.get('/content/products', { limit: 200 });
        (prodRes.data?.items || []).forEach(p => { productMap[p.productId] = p; });

        const imgRes = await API.get('/content/product-images', { limit: 200, sort: 'sortOrder' });
        allImages = imgRes.data?.items || [];
      } catch (e) {
        console.error('加载产品失败:', e);
        renderError();
        return;
      }

      renderPage();

      // 筛选按钮事件
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.filter;
          currentPage = 1;
          updateFilterButtons();
          renderPage();
        });
      });

      document.getElementById('loadMoreBtn').addEventListener('click', () => {
        currentPage++;
        renderPage(true);
      });
    });

    function updateFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentCategory);
      });
    }

    // 当前分类下的全部产品白底图（数据已在服务端取全量，这里只做分类筛选）
    function getFilteredImages() {
      return allImages.filter(item => {
        const prod = productMap[item.productId];
        return prod && prod.category === currentCategory;
      });
    }

    function renderPage(append = false) {
      const grid = document.getElementById('productsGrid');
      const loadMoreWrap = document.getElementById('loadMoreWrap');

      const filtered = getFilteredImages();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const items = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      if (!append && items.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon"><img src="/ICON/暂无数据.svg" class="icon-svg icon-svg-xl" alt=""></div><p data-i18n="products.empty">暂无产品</p></div>`;
        loadMoreWrap.classList.add('hidden');
        I18N.updatePage();
        return;
      }

      const html = items.map(item => {
        const prod = productMap[item.productId] || {};
        const img = item.image || '';
        const catIcon = prod.category === 'keyboard' ? '键盘' : (prod.category === 'mouse' ? '鼠标' : '耳机');
        return `
          <a href="detail.html?id=${item.productId}" class="product-card">
            <div class="card-img">
              ${img ? `<img src="${img}" alt="${prod.name || item.productId}" loading="lazy" decoding="async">` : `<span class="card-placeholder"><img src="/ICON/${catIcon}.svg" class="icon-svg icon-svg-xl" alt="" style="opacity:0.12;"></span>`}
            </div>
            <div class="card-info">
              <div class="card-name">${prod.name || item.productId}</div>
              <div class="card-subtitle">${prod.category === 'keyboard' ? '电竞键盘' : (prod.category === 'mouse' ? '电竞鼠标' : '电竞耳机')}</div>
            </div>
          </a>
      `}).join('');

      if (append) {
        grid.insertAdjacentHTML('beforeend', html);
      } else {
        grid.innerHTML = html;
      }

      loadMoreWrap.classList.toggle('hidden', currentPage >= totalPages);
      if (window.I18N) I18N.updatePage();
    }

    function renderError() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon"><img src="/ICON/暂无数据.svg" class="icon-svg icon-svg-xl" alt=""></div><p data-i18n="common.error">加载失败，请稍后重试</p></div>`;
      if (window.I18N) I18N.updatePage();
    }
  </script>
</body>
</html>
