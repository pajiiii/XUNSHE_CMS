<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XUNSHE 网页端驱动 — 连接设备后自动识别并打开对应驱动">
  <title data-i18n="drivers.web.title">网页端驱动 — XUNSHE 迅蛇</title>
  <link rel="icon" type="image/png" href="/logo/RED_LOGO.png">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .web-page {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 96px 24px 64px;
      background: radial-gradient(ellipse 70% 46% at 50% 22%, rgba(255,0,21,0.10) 0%, transparent 68%);
    }

    .web-box {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .web-kicker {
      display: inline-block;
      margin-bottom: 12px;
      font-family: var(--font-en);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--red-primary);
      opacity: 0.85;
    }

    .web-title {
      font-family: var(--font-en);
      font-size: 2.15rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .web-sub {
      margin-top: 10px;
      font-size: 0.9rem;
      line-height: 1.75;
      color: var(--text-secondary);
    }

    .web-visual {
      position: relative;
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      margin: 34px auto 30px;
      color: var(--red-primary);
      border: 1px solid rgba(255,0,21,0.26);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,21,0.16) 0%, rgba(255,0,21,0.02) 70%);
    }

    .web-visual::after {
      content: '';
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255,0,21,0.2);
      border-radius: 50%;
      animation: webPulse 2.6s ease-out infinite;
    }

    @keyframes webPulse {
      0% { transform: scale(0.92); opacity: 0.7; }
      70% { transform: scale(1.16); opacity: 0; }
      100% { transform: scale(1.16); opacity: 0; }
    }

    .connect-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 220px;
      padding: 16px 32px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      border-radius: 10px;
      background: var(--gradient-red);
      box-shadow: 0 10px 26px rgba(252, 36, 54, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: all var(--transition-fast);
    }

    .connect-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(252, 36, 54, 0.42);
    }

    .connect-btn:disabled {
      opacity: 0.6;
      cursor: progress;
      transform: none;
    }

    .connect-status {
      min-height: 22px;
      margin-top: 20px;
      font-size: 0.84rem;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .connect-status[hidden] { display: none; }

    .connect-status.is-ok { color: #6fe0a3; }
    .connect-status.is-warn { color: #f0b429; }
    .connect-status.is-error { color: #ff7a86; }

    .connect-detail {
      display: block;
      margin-top: 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      word-break: break-word;
    }

    .connect-note {
      margin-top: 26px;
      padding-top: 20px;
      font-size: 0.76rem;
      line-height: 1.8;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
    }

    .connect-note a {
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .connect-note a:hover { color: var(--red-primary); }

    .web-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 30px;
      padding: 9px 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border: 1px solid var(--border-card);
      border-radius: 999px;
      transition: all var(--transition-fast);
    }

    .web-back:hover {
      color: var(--text-primary);
      border-color: rgba(252, 36, 54, 0.4);
    }

    @media (max-width: 640px) {
      .web-page { padding: 84px 18px 48px; }
      .web-title { font-size: 1.7rem; }
      .web-visual { width: 80px; height: 80px; margin: 26px auto 24px; }
      .connect-btn { width: 100%; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .web-visual::after { animation: none; }
    }
  </style>
</head>
<body>

  <!-- ═══ 顶部导航 ═══ -->
  <nav class="navbar">

      <a href="/index.html" class="nav-brand">
        <img src="/logo/xunshe_top.png" class="brand-icon" style="width:168px;height:42px;border-radius:6px;" alt="XUNSHE">

      <ul class="nav-links">
        <li><a href="/index.html" data-i18n="nav.home"><img src="/ICON/主页.svg" class="icon-svg icon-svg-sm" alt=""> 首页</a></li>
        <li><a href="/products.html" data-i18n="nav.products"><img src="/ICON/产品中心.svg" class="icon-svg icon-svg-sm" alt=""> 产品中心</a></li>
        <li><a href="/drivers.html" class="active" data-i18n="nav.drivers"><img src="/ICON/驱动支持.svg" class="icon-svg icon-svg-sm" alt=""> 驱动下载</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="lang-switch">
          <button data-lang="zh-CN" class="active">简</button>
          <button data-lang="zh-TC">繁</button>

        <button class="nav-toggle" aria-label="菜单">
          <span></span><span></span><span></span>

      </div>
    </div>
  </nav>

  <main class="web-page">
    <div class="web-box">
      <span class="web-kicker" data-i18n="drivers.web.kicker">WEB DRIVER</span>
      <h1 class="web-title" data-i18n="drivers.web.title">网页端驱动</h1>
      <p class="web-sub" data-i18n="drivers.web.subtitle">连接设备，点击下方按钮，选择后自动打开对应驱动</p>

      <div class="web-visual" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4" width="19" height="13" rx="2"></rect>
          <path d="M8 21h8M12 17v4"></path>
          <path d="M7 9.5h4M7 12.5h7"></path>
        </svg>
      </div>

      <button type="button" id="connectBtn" class="connect-btn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21V7"></path>
          <path d="m8 11 4-4 4 4"></path>
          <circle cx="12" cy="4" r="1.6"></circle>
          <path d="M12 15a4 4 0 0 0 4-4"></path>
          <rect x="15.5" y="8.5" width="3.5" height="3.5" rx="1"></rect>
        </svg>
        <span data-connect-label data-i18n="drivers.web.connectBtn">连接设备</span>
      </button>

      <p id="connectStatus" class="connect-status" role="status" aria-live="polite" hidden></p>

      <p class="connect-note">
        <span data-i18n="drivers.web.note">支持迅蛇 X75 / X68 键盘、电竞鼠标；S1 耳机请下载客户端。</span>
        <a href="/drivers/download.html" data-i18n="drivers.web.noteLink">下载客户端</a>
      </p>

      <a class="web-back" href="/drivers.html">
        <span aria-hidden="true">←</span>
        <span data-i18n="drivers.web.back">返回驱动支持</span>
      </a>
    </div>
  </main>
