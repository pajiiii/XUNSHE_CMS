<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XUNSHE 网页端驱动 — 连接设备后自动识别并打开对应驱动">
  <title data-i18n="drivers.web.title">网页端驱动 — XUNSHE 迅蛇</title>
  <link rel="icon" type="image/png" href="/logo/RED_LOGO.png">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/drivers.css">
</head>
<body class="driver-page">

  <!-- ═══ 顶部导航 ═══ -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="nav-brand">
        <img src="/logo/xunshe_top.png" class="brand-icon" style="width:168px;height:42px;border-radius:6px;" alt="XUNSHE">
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" data-i18n="nav.home"><img src="/ICON/主页.svg" class="icon-svg icon-svg-sm" alt=""> 首页</a></li>
        <li><a href="/products.html" data-i18n="nav.products"><img src="/ICON/产品中心.svg" class="icon-svg icon-svg-sm" alt=""> 产品中心</a></li>
        <li><a href="/drivers.html" class="active" data-i18n="nav.drivers"><img src="/ICON/驱动支持.svg" class="icon-svg icon-svg-sm" alt=""> 驱动下载</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="lang-switch">
          <button data-lang="zh-CN" class="active">简</button>
          <button data-lang="zh-TC">繁</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="nav-toggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <main class="web-page">
    <div class="web-box">
      <div class="web-visual" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4" width="19" height="13" rx="2"></rect>
          <path d="M8 21h8M12 17v4"></path>
          <path d="M7 9.5h4M7 12.5h7"></path>
        </svg>
      </div>

      <h1 class="web-title" data-i18n="drivers.web.title">网页端驱动</h1>
      <p class="web-sub" data-i18n="drivers.web.subtitle">通过 USB 或无线接收器连接设备，选择设备后自动打开对应设置。</p>

      <button type="button" id="connectBtn" class="connect-btn" hidden>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21V7"></path>
          <path d="m8 11 4-4 4 4"></path>
          <circle cx="12" cy="4" r="1.6"></circle>
          <path d="M12 15a4 4 0 0 0 4-4"></path>
          <rect x="15.5" y="8.5" width="3.5" height="3.5" rx="1"></rect>
        </svg>
        <span data-connect-label data-i18n="drivers.web.connectBtn">连接设备</span>
      </button>

      <p id="connectStatus" class="connect-status" role="status" aria-live="polite" hidden></p>

      <p class="connect-note">
        <span data-i18n="drivers.web.note">也可以按型号下载客户端。</span>
        <a href="/drivers/download" data-i18n="drivers.web.noteLink">下载客户端</a>
      </p>

      <a class="web-back" href="/drivers.html">
        <span aria-hidden="true">←</span>
        <span data-i18n="drivers.web.back">返回驱动支持</span>
      </a>
    </div>
  </main>

  <!-- ═══ 页脚 ═══ -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand"><span class="brand-red">XUNSHE</span> 迅蛇</div>
        <p class="footer-desc" data-i18n="footer.description">专业电竞外设品牌。以蛇之迅捷，铸胜利之器。</p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.products">产品</h4>
        <a href="/products.html?category=keyboard" data-i18n="footer.keyboard">电竞键盘</a>
        <a href="/products.html?category=mouse" data-i18n="footer.mouse">电竞鼠标</a>
        <a href="/products.html?category=headphone" data-i18n="footer.headphone">电竞耳机</a>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.support">支持</h4>
        <a href="/drivers.html" data-i18n="nav.drivers">驱动下载</a>
        <a href="/manual.html" data-i18n="footer.manual">使用手册</a>
        <a href="/terms.html" data-i18n="footer.terms">使用协议</a>
      </div>
    </div>
    <div class="footer-inner footer-bottom">
      <span data-i18n="footer.rights">© 2026 XUNSHE. All rights reserved. 河南郑州讯蛇科技有限公司</span>
      <span data-i18n="footer.icp">豫ICP备2026038032号</span>
    </div>
  </footer>

  <!-- 数据文件必须先于业务逻辑加载 -->
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/device-map.js"></script>
  <script src="/js/driver-web.js"></script>
</body>
</html>
